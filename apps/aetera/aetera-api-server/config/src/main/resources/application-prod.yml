spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      max-lifetime: 570000

  jpa:
    properties:
      hibernate:
        format_sql: false

  # 메일. SMTP_* 를 채우지 않으면 **서버가 뜨지 않는다.**
  # 일부러 그렇게 둔다 — 메일을 보내겠다고 해 놓고 못 보내는 상태로 도는 것보다,
  # 배포하는 순간 아는 편이 낫다. 아직 준비가 안 됐으면 MAIL_SENDER=log 로 띄운다.
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

aetera:
  auth:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.aetera.io}
  mail:
    sender: ${MAIL_SENDER:email}
    # 주소만 둔다. "아이테라 <no-reply@…>" 처럼 표시 이름을 붙이려면 ASCII 가 아닌 글자를
    # RFC 2047 로 인코딩해야 하는데, SimpleMailMessage 는 그걸 해 주지 않는다 —
    # 인코딩 없이 나간 헤더는 받는 서버에 따라 깨지거나 거부된다.
    from: ${MAIL_FROM:no-reply@aetera.io}
  web:
    # 재설정 링크의 목적지. 요청 헤더에서 가져오지 않는 이유는 application.yml 에 적었다.
    base-url: ${WEB_BASE_URL:https://app.aetera.io}

server:
  # X-Forwarded-* 를 믿고 실제 클라이언트 주소를 복원한다. 이게 없으면 호출 한도가
  # **로드밸런서 하나를 한 사람으로** 세어, 누구 하나가 한도를 쓰면 모두가 막힌다.
  #
  # 로컬·개발에는 켜지 않는다. 이 헤더는 누구나 보낼 수 있어서, 믿어도 되는 것은 그것을
  # 반드시 덮어쓰는 프록시 뒤에 있을 때뿐이다 — 아무 데서나 켜면 한도를 우회하는 길이 된다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: info
