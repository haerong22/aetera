spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      max-lifetime: 570000

  jpa:
    properties:
      hibernate:
        format_sql: false

aetera:
  auth:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.aetera.io}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: info
