services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aetera
      POSTGRES_USER: aetera
      POSTGRES_PASSWORD: aetera
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/<major>/docker and expects a single
      # mount at /var/lib/postgresql. Mounting .../data (the pre-18 convention) makes it exit.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aetera -d aetera']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
